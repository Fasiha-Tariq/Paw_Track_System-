
name: Paw Track System CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-push:
    name: Build, Test and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Frontend Image
        run: |
          docker build -t pawtrack-frontend-test ./Frontend

      - name: Build Backend Image
        run: |
          docker build -t pawtrack-backend-test ./Backend

      # Create a shared network and start backend first
      - name: Test Backend Container
        run: |
          docker network create pawtrack-test-network

          docker run -d \
            --name backend-test \
            --network pawtrack-test-network \
            --network-alias backend \
            -p 8082:80 \
            pawtrack-backend-test

          for i in {1..10}; do
            if curl --fail --silent http://localhost:8082/index.js > /dev/null; then
              echo "Backend test passed!"
              break
            fi
            sleep 2
          done

          curl --fail http://localhost:8082/index.js > /dev/null

      # Start frontend on the same network
      - name: Test Frontend Container
        run: |
          docker run -d \
            --name frontend-test \
            --network pawtrack-test-network \
            -p 8081:80 \
            pawtrack-frontend-test

          for i in {1..10}; do
            if curl --fail --silent http://localhost:8081/ > /dev/null; then
              echo "Frontend test passed!"
              break
            fi
            sleep 2
          done

          curl --fail http://localhost:8081/ > /dev/null

          # Test frontend-to-backend communication
          curl --fail http://localhost:8081/backend/index.js > /dev/null

          echo "Frontend and backend integration test passed!"

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Frontend Image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: ./Frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pawtrack-frontend:version4
            ${{ secrets.DOCKERHUB_USERNAME }}/pawtrack-frontend:${{ github.sha }}

      - name: Build and Push Backend Image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: ./Backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pawtrack-backend:version4
            ${{ secrets.DOCKERHUB_USERNAME }}/pawtrack-backend:${{ github.sha }}
