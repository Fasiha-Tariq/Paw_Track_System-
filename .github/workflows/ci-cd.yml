
name: Paw Track System CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # JOB 1: Build, Test and Push Docker Images
  build-test-push:
    name: Build, Test and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Frontend Image
        run: |
          docker build -t pawtrack-frontend-test ./Frontend

      - name: Build Backend Image
        run: |
          docker build -t pawtrack-backend-test ./Backend

      # Test backend container
      - name: Test Backend Container
        run: |
          docker network create pawtrack-test-network

          docker run -d \
            --name backend-test \
            --network pawtrack-test-network \
            --network-alias backend \
            -p 8082:80 \
            pawtrack-backend-test

          for i in {1..10}; do
            if curl --fail --silent http://localhost:8082/index.js > /dev/null; then
              echo "Backend test passed!"
              break
            fi
            sleep 2
          done

          curl --fail http://localhost:8082/index.js > /dev/null

      # Test frontend and backend communication
      - name: Test Frontend Container
        run: |
          docker run -d \
            --name frontend-test \
            --network pawtrack-test-network \
            -p 8081:80 \
            pawtrack-frontend-test

          for i in {1..10}; do
            if curl --fail --silent http://localhost:8081/ > /dev/null; then
              echo "Frontend test passed!"
              break
            fi
            sleep 2
          done

          curl --fail http://localhost:8081/ > /dev/null

          curl --fail http://localhost:8081/backend/index.js > /dev/null

          echo "Frontend and backend integration test passed!"

      # Login to Docker Hub
      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Push frontend image
      - name: Build and Push Frontend Image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: ./Frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pawtrack-frontend:version4
            ${{ secrets.DOCKERHUB_USERNAME }}/pawtrack-frontend:${{ github.sha }}

      # Push backend image
      - name: Build and Push Backend Image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: ./Backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pawtrack-backend:version4
            ${{ secrets.DOCKERHUB_USERNAME }}/pawtrack-backend:${{ github.sha }}


  # JOB 2: Automatically Deploy to AWS EC2 using SSM
  deploy:
    name: Deploy to AWS EC2
    needs: build-test-push
    runs-on: ubuntu

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Deploy PawTrack through SSM
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          IMAGE_TAG: ${{ github.sha }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

        run: |
          set -e

          echo "Preparing PawTrack deployment..."

          jq -n \
            --arg username "$DOCKERHUB_USERNAME" \
            --arg tag "$IMAGE_TAG" \
            '{
              commands: [
                "set -e",
                "echo Starting PawTrack deployment...",
                "docker network inspect pawtrack-network >/dev/null 2>&1 || docker network create pawtrack-network",
                ("docker pull " + $username + "/pawtrack-backend:" + $tag),
                ("docker pull " + $username + "/pawtrack-frontend:" + $tag),
                "docker rm -f pawtrack-frontend pawtrack-backend 2>/dev/null || true",
                ("docker run -d --restart unless-stopped --name pawtrack-backend --network pawtrack-network --network-alias backend " + $username + "/pawtrack-backend:" + $tag),
                ("docker run -d --restart unless-stopped --name pawtrack-frontend --network pawtrack-network -p 80:80 " + $username + "/pawtrack-frontend:" + $tag),
                "docker ps",
                "echo PawTrack deployment completed successfully"
              ]
            }' > commands.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file://commands.json \
            --comment "PawTrack GitHub Actions deployment" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text

          echo "PawTrack deployment successful!"
